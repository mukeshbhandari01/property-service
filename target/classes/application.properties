spring.application.name=property-service
server.port=8082
spring.datasource.url=${PROPERTY_DB_URL:jdbc:postgresql://localhost:5432/propertydatadb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mukesh098}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
app.s3.bucket=${APP_S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-south-1}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.jwt.secret=${JWT_SECRET:local-development-only-change-this-secret-123456789}
app.jwt.cookie-name=JWT
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}